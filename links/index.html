<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090711">
  <meta name="description" content="כל הלינקים של ניקה ספוז במקום אחד — YouTube, Kick ו-TikTok.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nikasapoz | כל הלינקים שלי">
  <meta property="og:description" content="סרטונים, סטרימים וכל מה שביניהם ♡">
  <title>Nikasapoz ✦ כל הלינקים שלי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f9f6ff;
      --soft: #bfb9d5;
      --violet: #ad80ff;
      --violet-light: #e5c6ff;
      --border: rgba(225, 204, 255, .16);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #080610; }
    body {
      min-height: 100svh; margin: 0; overflow-x: hidden;
      font-family: 'Heebo', Arial, sans-serif; color: var(--ink);
      background: radial-gradient(ellipse 80% 45% at 50% -8%, #392359 0%, transparent 69%),
                  radial-gradient(ellipse 60% 28% at 95% 80%, rgba(55,20,94,.40), transparent 80%),
                  linear-gradient(155deg, #0a0710 0%, #07050c 58%, #100a19 100%);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(1px 1px at 8% 18%, #fff9 98%, transparent),
                  radial-gradient(1px 1px at 82% 9%, #fff7 98%, transparent),
                  radial-gradient(2px 2px at 26% 84%, #ffd8ffb3 98%, transparent),
                  radial-gradient(1px 1px at 91% 72%, #fff7 98%, transparent),
                  radial-gradient(1px 1px at 54% 35%, #ffffff70 98%, transparent),
                  radial-gradient(1px 1px at 14% 60%, #fff9 98%, transparent);
      background-size: 430px 420px; opacity: .65;
    }
    .glow { position: fixed; pointer-events:none; z-index:0; border-radius: 50%; filter: blur(66px); }
    .glow.one { width: 275px; height: 275px; background: #8551cf48; top: -120px; left: calc(50% - 145px); }
    .glow.two { width: 220px; height: 220px; background: #58299a22; bottom: -100px; right: -60px; }
    #rain, #sparkles { position: fixed; inset:0; overflow: hidden; pointer-events:none; z-index:1; }
    .drop {
      position:absolute; top: -22vh; left: var(--x); height: var(--h); width:1px;
      opacity: var(--opacity); border-radius: 50px; transform: rotate(11deg);
      background: linear-gradient(to bottom, transparent, #c6adf9aa, transparent);
      animation: rain-fall var(--duration) linear var(--delay) infinite;
    }
    .sparkle {
      position: absolute; left: var(--x); top: var(--y); width: var(--size); height: var(--size);
      border-radius:50%; background: white; opacity: 0;
      box-shadow: 0 0 10px 2px #c9a0ff88;
      animation: twinkle var(--duration) ease-in-out var(--delay) infinite alternate;
    }
    @keyframes rain-fall { to { transform: translate3d(-30px, 140vh, 0) rotate(11deg); } }
    @keyframes twinkle { 0%, 30% {opacity:0; transform:scale(.35)} 75%{opacity:.72} 100%{opacity:.15; transform:scale(1.6)} }
    .page { isolation:isolate; position:relative; z-index:2; width:100%; min-height:100svh; display:grid; place-items:center; padding: 54px 18px 35px; }
    .panel {
      position: relative; overflow: hidden; width: min(100%, 445px);
      padding: 43px 30px 28px; border: 1px solid var(--border); border-radius: 30px;
      background: linear-gradient(145deg, rgba(32,25,47,.78) 0%, rgba(14,11,23,.91) 56%, rgba(19,13,29,.90) 100%);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 28px 110px #0009, 0 0 55px #9b65ff0c, inset 0 1px #fff2;
      text-align: center;
    }
    .panel::before {
      content:""; position:absolute; top:0; left:20%; right:20%; height:1px;
      background:linear-gradient(90deg,transparent,#e3caff88,transparent);
    }
    .eyebrow { display:inline-flex; gap:8px; align-items:center; color:#d8c0ff; font-size:10px; font-weight:800; letter-spacing:.26em; text-transform:uppercase; direction:ltr; }
    .eyebrow span { width:5px; height:5px; background:#d9b4ff; transform:rotate(45deg); box-shadow:0 0 10px #b778ff; }
    .avatar-wrap { position:relative; width:111px; height:111px; margin: 24px auto 15px; border-radius:50%; padding:4px; background:linear-gradient(135deg,#f5c7ff,#ad7bf6 38%,#4c377d 77%,#f5c7ff); box-shadow:0 0 0 6px #b17ef415,0 0 36px #9d6de94a; }
    .avatar-wrap img { width:100%; height:100%; display:block; object-fit:cover; object-position:center; border-radius:50%; border:3px solid #100b1c; background:#221a32; }
    .avatar-star {position:absolute; color:#fff6d7; font-size:22px; text-shadow:0 0 14px #c69bff; }
    .avatar-star.s1 {right:-15px; top:9px;} .avatar-star.s2 {left:-12px; bottom:4px; font-size:14px;}
    h1 { margin: 0; font-family:'Heebo',sans-serif; direction:ltr; font-size:clamp(32px,8vw,43px); line-height:1.2; font-weight:900; letter-spacing:.015em; }
    h1 span { color: #e4c7ff; text-shadow:0 0 33px #bb80ff5c; }
    .handle { direction:ltr; margin-top:2px; color:#ba94ed; font-size:14px; font-weight:700; letter-spacing:.06em; }
    .subtitle { margin:14px auto 23px; font-size:14px; color:#d1c8e0; font-weight:500; line-height:1.75; }
    .divider { display:flex; align-items:center; justify-content:center; gap:12px; color:#b89cda; font-size:11px; font-weight:800; letter-spacing:.12em; margin-bottom:15px; }
    .divider::before,.divider::after { content:""; height:1px; width:56px; background:linear-gradient(90deg,transparent,#c49df74d); }
    .divider::after { transform:rotate(180deg); }
    .links {display:grid; gap:13px;}
    a.link {
      --tint:#c9a4ff;
      position:relative; display:flex; flex-direction:row; align-items:center; gap:14px;
      width:100%; min-height:76px; padding:13px 16px; overflow:hidden;
      border:1px solid #ffffff20; border-radius:19px; color:#fff;
      background:linear-gradient(108deg,rgba(255,255,255,.072),rgba(255,255,255,.025));
      box-shadow:inset 0 1px #ffffff0b;
      text-align:right; text-decoration:none; transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease;
      -webkit-tap-highlight-color:transparent;
    }
    a.link::before {content:""; position:absolute; top:0; right:0; height:100%; width:3px; background:var(--tint); opacity:.95; box-shadow:0 0 17px var(--tint);}
    a.link:hover {transform:translateY(-3px); border-color:var(--tint); background:linear-gradient(108deg,rgba(255,255,255,.12),rgba(255,255,255,.04)); box-shadow:0 12px 28px #0006,0 0 22px color-mix(in srgb,var(--tint),transparent 85%);}
    a.link:active {transform:translateY(0) scale(.988);}
    a.link:focus-visible {outline:3px solid #e1c4ff; outline-offset:3px;}
    .youtube {--tint:#ff526a!important;} .kick {--tint:#70ee86!important;} .tiktok {--tint:#59e4ef!important;}
    .link-icon { width:46px; height:46px; border-radius:14px; flex:0 0 46px; display:grid; place-items:center; background:color-mix(in srgb,var(--tint),transparent 88%); color:var(--tint); }
    .link-icon svg {display:block; width:25px; height:25px;}
    .link-text {display:flex; flex-direction:column; align-items:flex-start; gap:1px; flex:1; min-width:0;}
    .link-text strong {font-size:18px; font-weight:800; line-height:1.3;}
    .link-text small {font-size:11px; color:#c8c2d1; font-weight:500;}
    .arrow {flex:0 0 auto; width:23px; height:23px; display:grid; place-items:center; color:#c8b6df; font-size:22px; font-family:Arial,sans-serif; transition:transform .2s ease;}
    a.link:hover .arrow {transform:translate(-3px,-3px);}
    footer {margin-top:24px; color:#a69bb6; font-size:10px; letter-spacing:.16em; direction:ltr; font-weight:600;}
    footer span {color:#e9b7ff;}
    .tiny-star {display:inline-block; margin:0 6px; color:#d5b3ff;}
    @media(max-width:420px) {
      .page {padding:23px 13px 20px;}
      .panel {padding:31px 20px 23px; border-radius:24px;}
      .avatar-wrap {margin-top:19px;}
    }
    @media(prefers-reduced-motion:reduce) {
      .drop,.sparkle {animation:none; display:none;}
      .link,.arrow {transition:none!important;}
    }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <div id="rain" aria-hidden="true"></div>
  <div id="sparkles" aria-hidden="true"></div>
  <main class="page">
    <section class="panel" aria-label="כל הלינקים של ניקה ספוז">
      <div class="eyebrow"><span></span> THE NIKA UNIVERSE <span></span></div>
      <div class="avatar-wrap">
        <img src="https://raw.githubusercontent.com/nikaaaaaw/nikasapoz.github.io/main/veronika.jpg" alt="תמונת הפרופיל של ניקה" width="103" height="103" loading="eager">
        <span class="avatar-star s1" aria-hidden="true">✦</span>
        <span class="avatar-star s2" aria-hidden="true">✧</span>
      </div>
      <h1>Nika<span>sapoz</span></h1>
      <div class="handle">@nikasapoz</div>
      <p class="subtitle">סטרימים, סרטונים וקצת בלאגן ♡<br>תמצאו אותי בכל המקומות כאן למטה</p>
      <div class="divider">✦ בואו להתחבר ✦</div>
      <nav class="links" aria-label="רשתות חברתיות">
        <a class="link youtube" href="https://youtube.com/@nikasapoz?si=sene5qbbGI6xzV_G" target="_blank" rel="noopener noreferrer" aria-label="מעבר לערוץ היוטיוב של ניקה">
          <span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.3 6.3a2.94 2.94 0 0 0-2.06-2.08C19.4 3.73 12 3.73 12 3.73s-7.4 0-9.24.49A2.94 2.94 0 0 0 .7 6.3 30.7 30.7 0 0 0 .21 12c0 1.9.16 3.8.49 5.7a2.94 2.94 0 0 0 2.06 2.08c1.84.49 9.24.49 9.24.49s7.4 0 9.24-.49a2.94 2.94 0 0 0 2.06-2.08c.33-1.9.49-3.8.49-5.7s-.16-3.8-.49-5.7ZM9.6 15.55v-7.1L15.85 12 9.6 15.55Z"/></svg></span>
          <span class="link-text"><strong>YouTube</strong><small>הסרטונים והתגובות שלי</small></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link kick" href="https://kick.com/nikasapoz" target="_blank" rel="noopener noreferrer" aria-label="מעבר לערוץ הקיק של ניקה">
          <span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 2h6v7h3V6h3V3h6v6h-3v3h-3v3h3v3h3v4h-6v-3h-3v-3H9v6H3V2Z"/></svg></span>
          <span class="link-text"><strong>Kick</strong><small>בואו לסטרימים שלי</small></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link tiktok" href="https://www.tiktok.com/@nikasapoz?_r=1&amp;_t=ZS-9AYi0Iit5sb" target="_blank" rel="noopener noreferrer" aria-label="מעבר לערוץ הטיקטוק של ניקה">
          <span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.72 1.5c.16 2.74 1.66 4.42 4.26 4.59v4.07a9.46 9.46 0 0 1-4.26-1.17v7.1c0 4.12-3.31 6.99-7.18 6.4-2.79-.43-4.85-2.76-5.03-5.57-.24-3.89 2.84-7.09 6.65-7.09.49 0 .97.05 1.43.16v4.21a3.43 3.43 0 0 0-1.29-.25c-1.8 0-3.12 1.41-2.87 3.11a2.94 2.94 0 0 0 2.78 2.53c1.76.04 2.94-1.3 2.94-3.04V1.5h4.57Z"/></svg></span>
          <span class="link-text"><strong>TikTok</strong><small>קליפים ורגעים מהלייבים</small></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
      <footer>MADE WITH <span>♥</span> <span class="tiny-star">✦</span> Nikasapoz</footer>
    </section>
  </main>
  <script>
    (function () {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const rain = document.getElementById('rain');
      const stars = document.getElementById('sparkles');
      const mobile = window.matchMedia('(max-width: 500px)').matches;
      for (let i = 0; i < (mobile ? 48 : 84); i++) {
        const d = document.createElement('i');
        d.className = 'drop';
        d.style.setProperty('--x', Math.random() * 100 + '%');
        d.style.setProperty('--h', (20 + Math.random() * 50) + 'px');
        d.style.setProperty('--opacity', (.10 + Math.random() * .24).toFixed(2));
        d.style.setProperty('--duration', (2.8 + Math.random() * 3.4).toFixed(2) + 's');
        d.style.setProperty('--delay', (-Math.random() * 8).toFixed(2) + 's');
        rain.appendChild(d);
      }
      for (let i = 0; i < (mobile ? 18 : 34); i++) {
        const s = document.createElement('i');
        s.className = 'sparkle';
        s.style.setProperty('--x', Math.random() * 100 + '%');
        s.style.setProperty('--y', Math.random() * 100 + '%');
        s.style.setProperty('--size', (1 + Math.random() * 2.5).toFixed(2) + 'px');
        s.style.setProperty('--duration', (1.7 + Math.random() * 3.1).toFixed(2) + 's');
        s.style.setProperty('--delay', (-Math.random() * 6).toFixed(2) + 's');
        stars.appendChild(s);
      }
    })();
  </script>
</body>
</html>
